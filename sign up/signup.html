<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LandRecord - Create Your Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-container">

        <!-- LEFT SIDE -->
        <section class="brand-panel">

            <div class="brand">

                <div class="brand-logo">
                    🌿
                </div>

                <div class="brand-info">
                    <h2>LandRecord</h2>
                    <p>Smart. Secure. Reliable.</p>
                </div>

            </div>


            <div class="brand-content">

                <h1>
                    Digital Land Records
                    Made Simple
                </h1>

                <p>
                    Manage, verify and secure land
                    records with intelligence and
                    transparency.
                </p>

            </div>


            <!-- LANDSCAPE -->
            <div class="landscape">

                <div class="sun"></div>

                <div class="mountain mountain-back"></div>

                <div class="mountain mountain-front"></div>

                <div class="house">

                    <div class="roof"></div>

                    <div class="window window-left"></div>

                    <div class="window window-right"></div>

                    <div class="door"></div>

                </div>

                <div class="field"></div>

            </div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="signup-panel">

            <div class="signup-box">

                <!-- HEADING -->

                <div class="signup-heading">

                    <h1>Create Your Account</h1>

                    <p>Sign up to get started</p>

                </div>


                <!-- SIGN UP FORM -->

                <form id="signupForm">


                    <!-- FULL NAME -->

                    <div class="signup-field">

                        <label for="fullName">
                            Full Name
                        </label>

                        <div class="signup-input">

                            <span>♙</span>

                            <input
                                type="text"
                                id="fullName"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                required
                            >

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="signup-field">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="signup-input">

                            <span>✉</span>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email address"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- USERNAME -->

                    <div class="signup-field">

                        <label for="username">
                            Username
                        </label>

                        <div class="signup-input">

                            <span>♙</span>

                            <input
                                type="text"
                                id="username"
                                placeholder="Choose a username"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="signup-field">

                        <label for="password">
                            Password
                        </label>

                        <div class="signup-input">

                            <span>🔒</span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                id="showPassword"
                            >
                                ◉
                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="signup-field">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="signup-input">

                            <span>🔒</span>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                id="showConfirmPassword"
                            >
                                ◉
                            </button>

                        </div>

                    </div>


                    <!-- TERMS -->

                    <label class="terms-row">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">Terms &amp; Conditions</a>
                            and
                            <a href="#">Privacy Policy</a>
                        </span>

                    </label>


                    <!-- SIGN UP -->

                    <button
                        type="submit"
                        class="signup-submit"
                        href="../landing page/landing.html"
                    >

                        <span>♙</span>

                        Sign Up

                    </button>

                </form>


                <!-- DIVIDER -->

                <div class="signup-divider">

                    <span>or continue with</span>

                </div>


                <!-- SOCIAL LOGIN -->

                <div class="signup-social">

                    <button
                        type="button"
                        class="signup-social-btn"
                    >

                        <span class="google-g">
                            G
                        </span>

                        Google

                    </button>


                    <button
                        type="button"
                        class="signup-social-btn"
                        href="../login/login.html"
                    >

                        <span class="ms-logo">

                            <i></i>
                            <i></i>
                            <i></i>
                            <i></i>

                        </span>

                        Microsoft

                    </button>

                </div>


                <!-- LOGIN LINK -->

                <p class="already-account">

                    Already have an account?

                    <a href="../login/login.html">
                        Login
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- SECURITY FOOTER -->

    <div class="security-footer">

        🛡️ &nbsp;
        Your data is 100% secure with us.

    </div>


    <script src="signup.js"></script>

</body>

</html>
